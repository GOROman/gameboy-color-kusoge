name: Build, test, and release ROM

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned GBDK-2020
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz -o "$RUNNER_TEMP/gbdk.tar.gz"
          echo "d7857a5f6d135ee4c249043ca26aad9f2ec8ab5d4106d97720d404114f42605c  $RUNNER_TEMP/gbdk.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gbdk.tar.gz" -C "$RUNNER_TEMP"
          echo "GBDK_LCC=$RUNNER_TEMP/gbdk/bin/lcc" >> "$GITHUB_ENV"
      - name: Build Game Boy Color ROM
        run: |
          python scripts/build.py
          git diff --exit-code -- standalone.c
      - name: Install emulator
        run: python -m pip install pyboy==2.7.0 pillow==12.3.0
      - name: Test real ROM gameplay
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python scripts/test_rom.py build/dash-duel.gbc
      - name: Create checksum
        run: cd build && sha256sum dash-duel.gbc > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dash-duel-${{ github.ref_name }}
          path: |
            build/dash-duel.gbc
            build/SHA256SUMS
            build/gameplay-test.png
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download tested build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name "dash-duel-${GITHUB_REF_NAME}" --dir release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/dash-duel.gbc release/SHA256SUMS release/gameplay-test.png --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "DASH // DUEL $GITHUB_REF_NAME" --notes-file .github/RELEASE_NOTES.md release/dash-duel.gbc release/SHA256SUMS release/gameplay-test.png
          fi
